name: Actualización diaria de zapatillas (12:00 ART)

on:
  schedule:
    # 15:00 UTC = 12:00 hs Argentina (UTC-3) todos los días
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar catálogo de las 15 tiendas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          NOTIFY_IF_EMPTY: "false"
        run: python -m scraper.run

      - name: Guardar cambios en el historial y catálogo
        run: |
          git config user.name "Zapatillas Bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/data/catalog.json web/data/history.json
          git diff --staged --quiet || git commit -m "chore: actualización diaria 12:00 ART"
          git push

      - name: Publicar sitio en GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    needs: scrape-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
